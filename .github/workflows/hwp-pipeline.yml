name: HWP/HWPX AI Pipeline & GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      refresh_llm:
        description: "Re-run BAZE LLM extraction across all HWP/HWPX samples"
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify pure-Python HWP 5.0 & HWPX parser on defense samples
        run: python3 pipeline/hwp_parser.py --verify

      - name: Run BAZE LLM pipeline (if manual refresh requested) or verify JSON bundle
        env:
          BAZE_API_KEY: ${{ secrets.BAZE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.refresh_llm }}" = "true" ] && [ -n "$BAZE_API_KEY" ]; then
            python3 pipeline/baze_pipeline.py
          else
            python3 pipeline/baze_pipeline.py --verify-only
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
